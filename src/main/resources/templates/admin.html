<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>GIS 상권 데이터 센터 (Admin)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; padding: 30px; background: #f0f2f5; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { border-bottom: 2px solid #333; padding-bottom: 15px; margin: 35px 0 20px 0; font-size: 22px; display: flex; align-items: center; justify-content: space-between; }
        h2:first-child { margin-top: 0; }

        /* --- [Dashboard Styles] --- */
        .dashboard-row { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: #fff; border: 1px solid #e9ecef; border-radius: 10px; padding: 25px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .stat-card h4 { margin: 0; font-size: 14px; color: #868e96; }
        .stat-number { font-size: 38px; font-weight: 800; color: #007bff; margin: 10px 0; }
        .control-panel { display: flex; gap: 10px; margin-top: 10px; }
        .btn-mini { padding: 8px 15px; font-size: 13px; border-radius: 6px; cursor: pointer; border: 1px solid #dee2e6; background: #fff; transition: 0.2s; }
        .btn-mini:hover { background: #f1f3f5; }
        .btn-danger-mini { color: #fa5252; border-color: #ffc9c9; }
        .btn-danger-mini:hover { background: #fff5f5; }

        /* --- [ETL Styles] --- */
        .option-group { display: flex; gap: 30px; margin-bottom: 25px; padding: 25px; background: #f8f9fa; border-radius: 10px; border: 1px solid #e9ecef; }
        .option-item { display: flex; flex-direction: column; flex: 1; }
        .option-item label { font-weight: 700; font-size: 14px; margin-bottom: 8px; color: #495057; }
        select { padding: 12px; border-radius: 6px; border: 1px solid #ced4da; font-size: 14px; width: 100%; transition: 0.2s; }
        .badge { display: inline-block; padding: 6px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; margin-top: 10px; visibility: hidden; text-align: center; }
        .badge.show { visibility: visible; animation: popIn 0.3s forwards; }
        .badge-blue { background: #e7f5ff; color: #007bff; border: 1px solid #cce5ff; }
        .badge-green { background: #e6fcf5; color: #0ca678; border: 1px solid #c3fae8; }
        .upload-box { border: 2px dashed #adb5bd; padding: 50px; text-align: center; cursor: pointer; border-radius: 10px; background: #fff; transition: 0.2s; margin-bottom: 30px; }
        .upload-box:hover { background: #f8f9fa; border-color: #007bff; transform: translateY(-2px); }
        .mapping-area { display: none; margin-top: 30px; border-top: 2px solid #f1f3f5; padding-top: 30px; }
        .mapping-row { display: flex; align-items: center; margin-bottom: 12px; padding: 15px; background: #fff; border: 1px solid #dee2e6; border-radius: 8px; }
        .mapping-label { width: 160px; font-weight: bold; font-size: 15px; color: #495057; }
        .preview-wrapper { overflow-x: auto; max-height: 300px; border: 1px solid #dee2e6; border-radius: 8px; margin-top: 15px; }
        .preview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .preview-table th { background: #343a40; color: white; padding: 12px 15px; text-align: left; position: sticky; top: 0; white-space: nowrap; }
        .preview-table td { border-bottom: 1px solid #f1f3f5; padding: 10px 15px; white-space: nowrap; }
        .btn-submit { background: #007bff; color: white; border: none; padding: 16px; width: 100%; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 40px; transition: 0.2s; }
        .btn-submit:hover { background: #0069d9; }

        /* --- [추가된 Progress Bar 스타일] --- */
        #progressContainer { display: none; margin-top: 20px; text-align: center; }
        .progress-bar-bg { width: 100%; background-color: #e9ecef; border-radius: 10px; overflow: hidden; height: 25px; margin-top: 10px; }
        .progress-bar-fill { height: 100%; background-color: #28a745; width: 0%; transition: width 0.3s ease; text-align: center; line-height: 25px; color: white; font-size: 12px; font-weight: bold; }

        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h2>
        📈 데이터 현황 대시보드
        <div class="control-panel">
            <button class="btn-mini" onclick="loadStats()">🔄 갱신</button>
            <button class="btn-mini" onclick="optimizeDB()">⚡ GIS 최적화</button>
            <button class="btn-mini btn-danger-mini" onclick="clearData()">🗑️ 초기화</button>
        </div>
    </h2>

    <div class="dashboard-row">
        <div class="stat-card">
            <h4>전체 데이터 건수</h4>
            <div id="totalCountDisplay" class="stat-number">0</div>
            <p style="font-size: 12px; color: #adb5bd;">PostGIS shop_data 테이블</p>
        </div>
        <div class="stat-card" style="align-items: flex-start; padding: 15px;">
            <h4 style="margin-bottom: 10px;">주요 상권 카테고리 비중</h4>
            <canvas id="categoryChart" style="max-height: 120px;"></canvas>
        </div>
    </div>

    <h2>🛠️ 데이터 전처리 및 업로드 (ETL)</h2>

    <div class="option-group">
        <div class="option-item">
            <label>🔤 파일 인코딩</label>
            <select id="encodingSelect" onchange="reloadPreview()">
                <option value="EUC-KR" selected>EUC-KR (한국 표준)</option>
                <option value="UTF-8">UTF-8 (글로벌 표준)</option>
            </select>
        </div>
        <div class="option-item">
            <label>🌍 원본 좌표계 (자동 감지)</label>
            <select id="sridSelect">
                <option value="5179" selected>EPSG:5179 (미터)</option>
                <option value="4326">EPSG:4326 (위경도)</option>
            </select>
            <div id="detectBadge" class="badge"></div>
        </div>
    </div>

    <div class="upload-box" id="dropArea">
        <div style="font-size: 40px; margin-bottom: 15px;">📂</div>
        <h3>CSV 파일을 드래그하거나 클릭하세요</h3>
        <div id="fileInfo" style="margin-top: 15px; font-weight: bold; color: #007bff; font-size: 16px;"></div>
        <input type="file" id="fileInput" accept=".csv" style="display: none;">
    </div>

    <div class="mapping-area" id="mappingArea">
        <h3>1️⃣ 컬럼 매핑 (데이터 짝짓기)</h3>
        <div id="mappingContainer"></div>

        <h3 style="margin-top:40px;">2️⃣ 데이터 미리보기 (상위 5건)</h3>
        <div class="preview-wrapper">
            <table class="preview-table" id="previewTable"></table>
        </div>

        <button class="btn-submit" id="submitBtn" onclick="uploadData()">🚀 DB에 저장하기</button>

        <div id="progressContainer">
            <h4 id="progressStatusText">데이터 저장 중... 잠시만 기다려주세요</h4>
            <div class="progress-bar-bg">
                <div id="progressBar" class="progress-bar-fill">0%</div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- 1. 대시보드 관련 함수 (기존 유지) ---
    let categoryChart;

    async function loadStats() {
        try {
            // [원복] 기존 API 엔드포인트 유지 (/admin/summary)
            const res = await fetch('/admin/summary');
            const data = await res.json();

            document.getElementById('totalCountDisplay').innerText = data.totalCount.toLocaleString();
            renderChart(data.categoryStats);
        } catch (e) { console.error("통계 로드 실패", e); }
    }

    function renderChart(stats) {
        const ctx = document.getElementById('categoryChart').getContext('2d');
        if (categoryChart) categoryChart.destroy();

        categoryChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: stats.map(s => s.category_main),
                datasets: [{
                    label: '건수',
                    data: stats.map(s => s.cnt),
                    backgroundColor: '#80bdff',
                    borderRadius: 5
                }]
            },
            options: {
                indexAxis: 'y',
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { ticks: { font: { size: 10 } } } }
            }
        });
    }

    // [원복] GIS 최적화 기능 유지
    async function optimizeDB() {
        if (!confirm("공간 인덱스 재빌드를 시작하시겠습니까? 데이터가 많으면 수 분이 걸릴 수 있습니다.")) return;
        const res = await fetch('/admin/maintenance/optimize', { method: 'POST' });
        alert(await res.text());
    }

    async function clearData() {
        if (!confirm("정말로 모든 데이터를 삭제하시겠습니까? 복구할 수 없습니다.")) return;
        const res = await fetch('/admin/data/clear', { method: 'DELETE' });
        alert(await res.text());
        loadStats();
    }

    // --- 2. 기존 업로드/매핑 로직 (기존 유지) ---
    const fileInput = document.getElementById('fileInput');
    const dropArea = document.getElementById('dropArea');
    const mappingArea = document.getElementById('mappingArea');
    const encodingSelect = document.getElementById('encodingSelect');
    const fileInfo = document.getElementById('fileInfo');

    let selectedFile = null;
    let csvHeaders = [];
    Papa.parsedData = [];

    const dtoFields = [
        { key: 'shopName', label: '상호명' },
        { key: 'categoryMain', label: '대분류' },
        { key: 'categorySub', label: '소분류' },
        { key: 'address', label: '도로명주소' },
        { key: 'lon', label: '경도 (X좌표)' },
        { key: 'lat', label: '위도 (Y좌표)' }
    ];

    dropArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) handleFile(e.target.files[0]); });

    function handleFile(file) {
        selectedFile = file;
        fileInfo.textContent = "📄 " + selectedFile.name;
        reloadPreview();
    }

    function reloadPreview() {
        if (!selectedFile) return;
        const currentEncoding = encodingSelect.value;
        const badge = document.getElementById('detectBadge');
        if(badge) { badge.className = 'badge'; badge.innerText = ''; }

        Papa.parse(selectedFile, {
            header: true, preview: 5, skipEmptyLines: true, encoding: currentEncoding,
            complete: function(results) {
                Papa.parsedData = results.data;
                csvHeaders = results.meta.fields;
                renderMappingUI();
                renderTable(results.data);
                mappingArea.style.display = 'block';
                setTimeout(autoDetectSrid, 300);
            }
        });
    }

    function renderMappingUI() {
        const container = document.getElementById('mappingContainer');
        container.innerHTML = '';
        dtoFields.forEach(field => {
            let options = `<option value="">(선택 안 함)</option>`;
            let searchKeywords = [];
            if (field.key === 'lon') searchKeywords = ['경도', 'lon', 'x'];
            else if (field.key === 'lat') searchKeywords = ['위도', 'lat', 'y'];
            else searchKeywords = [field.label.substring(0, 2)];

            csvHeaders.forEach(header => {
                const isMatch = searchKeywords.some(kw => header.toLowerCase().includes(kw.toLowerCase()));
                options += `<option value="${header}" ${isMatch ? 'selected' : ''}>${header}</option>`;
            });

            container.innerHTML += `
                <div class="mapping-row">
                    <div class="mapping-label">${field.label}</div>➜
                    <select id="map-${field.key}" style="width:250px; margin-left:15px;" onchange="autoDetectSrid()">${options}</select>
                </div>`;
        });
    }

    function autoDetectSrid() {
        const lonCol = document.getElementById('map-lon').value;
        const latCol = document.getElementById('map-lat').value;
        const sridSelect = document.getElementById('sridSelect');
        const badge = document.getElementById('detectBadge');
        if (!Papa.parsedData || Papa.parsedData.length === 0 || (!lonCol && !latCol)) return;

        const firstRow = Papa.parsedData[0];
        const val = parseFloat(String(firstRow[lonCol] || firstRow[latCol]).replace(/,/g, ''));
        if (isNaN(val)) return;

        if (val > 0 && val < 200) {
            sridSelect.value = "4326";
            badge.innerText = "✨ 위경도(4326) 감지됨"; badge.className = "badge badge-blue show";
        } else if (val > 10000) {
            sridSelect.value = "5179";
            badge.innerText = "✨ 미터(5179) 감지됨"; badge.className = "badge badge-green show";
        }
    }

    function renderTable(data) {
        const table = document.getElementById('previewTable');
        table.innerHTML = `<tr>${csvHeaders.map(h => `<th>${h}</th>`).join('')}</tr>`;
        data.forEach(row => {
            table.innerHTML += `<tr>${csvHeaders.map(h => `<td>${row[h] || ''}</td>`).join('')}</tr>`;
        });
    }

    // --- 3. [수정] 업로드 함수 (기존 로직 + 프로그레스 바 UI 추가) ---
    async function uploadData() {
        if (!selectedFile) return;

        // 1. 매핑 데이터 수집 (기존 로직 유지)
        const mapping = {};
        dtoFields.forEach(f => {
            const val = document.getElementById(`map-${f.key}`).value;
            if (val) mapping[val] = f.key;
        });

        const formData = new FormData();
        formData.append("file", selectedFile);
        formData.append("mapping", JSON.stringify(mapping));
        formData.append("srid", document.getElementById('sridSelect').value);
        formData.append("encoding", encodingSelect.value);

        // 2. UI 전환 (버튼 숨기고, 프로그레스 바 표시)
        const btn = document.getElementById('submitBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        btn.style.display = 'none'; // 버튼 숨김
        progressContainer.style.display = 'block'; // 바 표시
        progressBar.style.width = '0%';
        progressBar.innerText = '0%';

        // 3. 가짜 진행률 애니메이션 (90%까지만)
        // 백엔드에서 실시간 진행률을 안 주더라도, 사용자가 멈춘 게 아니라고 느끼게 함
        let progress = 0;
        const fakeInterval = setInterval(() => {
            if (progress < 90) {
                progress += Math.floor(Math.random() * 5) + 1; // 1~5%씩 랜덤 증가
                if(progress > 90) progress = 90;
                progressBar.style.width = progress + '%';
                progressBar.innerText = progress + '%';
            }
        }, 500);

        try {
            // [원복] 기존 업로드 API (/admin/upload) 호출
            const res = await fetch('/admin/upload', { method: 'POST', body: formData });

            // 응답 완료 시
            clearInterval(fakeInterval);
            progressBar.style.width = '100%';
            progressBar.innerText = '100%';

            alert(await res.text());

            loadStats(); // 대시보드 갱신
            mappingArea.style.display = 'none'; // 매핑 영역 닫기

        } catch (e) {
            alert("업로드 실패: " + e);
            // 실패 시 UI 복구
            btn.style.display = 'block';
            progressContainer.style.display = 'none';
        }
    }

    // 초기 실행
    window.onload = loadStats;
</script>
</body>
</html>
